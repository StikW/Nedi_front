<div
  class="dialog-overlay"
  *ngIf="dialogState.type !== 'none'"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  aria-labelledby="app-dialog-title"
>
  <div class="dialog-container" [class]="variantClass" (click)="$event.stopPropagation()">
    <div class="dialog-icon" [class]="variantClass" aria-hidden="true">
      <svg *ngIf="variantClass === 'danger'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 9v4M12 17h.01" stroke-linecap="round"/>
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg *ngIf="variantClass === 'warning'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 8v4M12 16h.01" stroke-linecap="round"/>
      </svg>
      <svg *ngIf="variantClass === 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg *ngIf="variantClass === 'default'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4M12 8h.01" stroke-linecap="round"/>
      </svg>
    </div>

    <h2 id="app-dialog-title">{{ title }}</h2>
    <p class="dialog-message">{{ message }}</p>

    <div class="dialog-actions">
      <button
        *ngIf="dialogState.type === 'confirm'"
        type="button"
        class="btn-secondary"
        (click)="cancel()"
      >
        {{ cancelText }}
      </button>
      <button
        type="button"
        class="btn-primary"
        [class.btn-danger]="variantClass === 'danger'"
        (click)="accept()"
      >
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
