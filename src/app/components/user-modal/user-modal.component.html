<div class="modal-overlay" *ngIf="isOpen" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ modalTitle }}</h2>
      <button class="close-btn" (click)="onClose()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" class="modal-form">
      <div class="form-group">
        <label for="name">Nombre Completo *</label>
        <input 
          type="text" 
          id="name" 
          [(ngModel)]="formData.name" 
          name="name"
          required
          placeholder="Ingresa el nombre completo">
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico *</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="formData.email" 
          name="email"
          required
          placeholder="usuario@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="password">
          Contraseña 
          <span *ngIf="mode === 'create'">*</span>
          <span *ngIf="mode === 'edit'" class="optional-text">(opcional)</span>
        </label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="formData.password" 
          name="password"
          [required]="mode === 'create'"
          [placeholder]="mode === 'create' ? 'Ingresa una contraseña segura' : 'Deja vacío para mantener la contraseña actual'">
      </div>

      <div class="form-group">
        <label for="role">Rol *</label>
        <select 
          id="role" 
          [(ngModel)]="formData.role" 
          name="role"
          required>
          <option *ngFor="let role of roles" [value]="role.value">
            {{ role.label }}
          </option>
        </select>
      </div>

      <!-- Campos específicos para instructores -->
      <div class="form-section">
        <h3>Configuración de Integración</h3>
        
        <div class="form-group">
          <label for="clientIdApp">Client ID App *</label>
          <input 
            type="text" 
            id="clientIdApp" 
            [(ngModel)]="formData.clientIdApp" 
            name="clientIdApp"
            required
            placeholder="Ingresa el Client ID de la aplicación">
        </div>

        <div class="form-group">
          <label for="clientSecretApp">Client Secret App *</label>
          <input 
            type="password" 
            id="clientSecretApp" 
            [(ngModel)]="formData.clientSecretApp" 
            name="clientSecretApp"
            required
            placeholder="Ingresa el Client Secret de la aplicación">
        </div>

        <div class="form-group">
          <label for="businessAccountId">Business Account ID *</label>
          <input 
            type="text" 
            id="businessAccountId" 
            [(ngModel)]="formData.businessAccountId" 
            name="businessAccountId"
            required
            placeholder="Ingresa el Business Account ID">
        </div>

        <div class="form-group">
          <label for="accessToken">Access Token *</label>
          <input 
            type="password" 
            id="accessToken" 
            [(ngModel)]="formData.accessToken" 
            name="accessToken"
            required
            placeholder="Ingresa el Access Token">
        </div>

        <div class="form-group">
          <label for="apiKey">API Key *</label>
          <input 
            type="password" 
            id="apiKey" 
            [(ngModel)]="formData.apiKey" 
            name="apiKey"
            required
            placeholder="Ingresa la API Key">
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="onClose()">
          Cancelar
        </button>
        <button 
          type="submit" 
          class="btn-primary" 
          [disabled]="!isFormValid() || isLoading">
          <svg *ngIf="isLoading" xmlns="http://www.w3.org/2000/svg" class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 11-6.219-8.56"></path>
          </svg>
          {{ isLoading ? 'Procesando...' : submitButtonText }}
        </button>
      </div>
    </form>
  </div>
</div>
