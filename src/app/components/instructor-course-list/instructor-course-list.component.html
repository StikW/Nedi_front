<div class="course-grid">
  <div *ngFor="let course of courses" class="course-card">
    <a [routerLink]="['/instructor/courses', course.id]" class="course-link">
      <img [src]="course.imageUrl" [alt]="course.title">
      <div class="course-content">
        <h3>{{ course.title }}</h3>
        <p>{{ course.description }}</p>
        <div class="course-stats">
          <span class="status" [class]="course.status">{{ getStatusLabel(course.status) }}</span>
          <span class="visibility-badge" [ngClass]="visibilityClass(course)">{{ getVisibilityLabel(course) }}</span>
          <span class="category">{{ course.category }}</span>
        </div>
      </div>
    </a>
    <button class="delete-btn" 
            (click)="onDeleteCourse($event, course.id)"
            [disabled]="deletingCourseId === course.id"
            [class.delete-btn--disabled]="deletingCourseId === course.id"
            title="Eliminar curso">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3,6 5,6 21,6"></polyline>
        <path d="M19,6v14a2,2 0 0,1 -2,2H7a2,2 0 0,1 -2,-2V6m3,0V4a2,2 0 0,1 2,-2h4a2,2 0 0,1 2,2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    </button>
    <button
      *ngIf="showShareButton(course)"
      type="button"
      class="share-round-btn"
      [class.share-round-btn--copied]="copiedCourseId === course.id"
      (click)="copyShareLink($event, course)"
      [title]="copiedCourseId === course.id ? 'Enlace copiado' : 'Copiar enlace de registro'">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
    </button>
  </div>
</div>
