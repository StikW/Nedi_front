<app-navbar></app-navbar>
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Crear Cuenta</h1>
      <p class="auth-subtitle">Únete a nosotros y comienza tu viaje de certificación</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="fullName">Nombre Completo</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          [(ngModel)]="fullName"
          placeholder="Ingresa tu nombre completo"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email"
          placeholder="Ingresa tu correo electrónico"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password"
          placeholder="Crea una contraseña"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          [(ngModel)]="confirmPassword"
          placeholder="Confirma tu contraseña"
          required
        >
      </div>

      <div class="form-options">
        <label class="terms-checkbox">
          <input type="checkbox" [(ngModel)]="acceptTerms" name="acceptTerms" required>
          <span>Acepto los <a href="#" class="terms-link">Términos de Servicio</a> y la <a href="#" class="terms-link">Política de Privacidad</a></span>
        </label>
      </div>

      <button type="submit" class="auth-button btn-gradient">Crear Cuenta</button>
    </form>

    <div class="auth-footer">
      <p>¿Ya tienes una cuenta? <a routerLink="/login" class="auth-link">Inicia sesión</a></p>
    </div>
  </div>
</div>
