<div class="login-container">
  <div class="login-card">
    <h1>Bienvenido de Vuelta</h1>
    <p class="login-subtitle">Inicia sesión para continuar tu viaje de aprendizaje</p>
    
    <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="formData.email"
          required
          email
          #emailInput="ngModel"
          [class.error]="emailInput.invalid && (emailInput.touched || loginForm.submitted)"
          placeholder="Ingresa tu correo electrónico"
          [disabled]="isLoading"
        >
        <div class="error-message" *ngIf="emailInput.invalid && (emailInput.touched || loginForm.submitted)">
          <span *ngIf="emailInput.errors?.['required']">El correo electrónico es requerido</span>
          <span *ngIf="emailInput.errors?.['email']">Por favor ingresa un correo electrónico válido</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-input-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="formData.password"
            required
            minlength="6"
            #passwordInput="ngModel"
            [class.error]="passwordInput.invalid && (passwordInput.touched || loginForm.submitted)"
            placeholder="Ingresa tu contraseña"
            [disabled]="isLoading"
          >
          <button 
            type="button" 
            class="toggle-password" 
            (click)="togglePassword()"
            [disabled]="isLoading"
          >
            <svg xmlns="http://www.w3.org/2000/svg" [class]="showPassword ? 'icon-eye-off' : 'icon-eye'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path *ngIf="!showPassword" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle *ngIf="!showPassword" cx="12" cy="12" r="3"></circle>
              <path *ngIf="showPassword" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line *ngIf="showPassword" x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div class="error-message" *ngIf="passwordInput.invalid && (passwordInput.touched || loginForm.submitted)">
          <span *ngIf="passwordInput.errors?.['required']">La contraseña es requerida</span>
          <span *ngIf="passwordInput.errors?.['minlength']">La contraseña debe tener al menos 6 caracteres</span>
        </div>
      </div>

      <div class="error-message server-error" *ngIf="serverError">
        {{ serverError }}
      </div>

      <button 
        type="submit" 
        class="login-btn" 
        [disabled]="isLoading"
      >
        <span class="btn-content" [class.loading]="isLoading">
          <svg *ngIf="isLoading" class="spinner" viewBox="0 0 50 50">
            <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
          </svg>
          {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
        </span>
      </button>

      <div class="login-footer">
        <p>¿No tienes una cuenta? <a routerLink="/register">Regístrate</a></p>
      </div>
    </form>
  </div>
</div>
